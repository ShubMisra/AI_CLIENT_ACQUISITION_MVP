name: Supervised orchestrator dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q orchestrator tests
      - run: python -m pytest -q tests/test_orchestrator.py tests/test_orchestrator_dispatch.py tests/test_orchestrator_cancellation.py tests/test_orchestrator_readonly.py
