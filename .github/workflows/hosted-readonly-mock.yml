name: Hosted read-only pilot - offline mock

on:
  push:
    branches: [feat/hosted-readonly-pilot]
  pull_request:
    branches: [feat/supervised-orchestrator]

permissions:
  contents: read

concurrency:
  group: hosted-mock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-mock:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout public review SHA without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python for host validation and full regression
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Full regression and syntax
        run: |
          python -m pip install -r requirements.txt pytest
          python -m compileall -q acqsys orchestrator tests
          python -m pytest -q
      - name: Pull pinned public Python image before sandbox starts
        run: docker pull python@sha256:65a93d69fa75478d554f4ad27c85c1e69fa184956261b4301ebaf6dbb0a3543d
      - name: One-shot simulated founder approval and sandboxed mock Codex
        run: python -m orchestrator.hosted_offline offline-mock
      - name: Publish only sanitized mock result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-mock-result
          path: ${{ runner.temp }}/hosted-pilot-result/hosted-mock-result.json
          if-no-files-found: error
          retention-days: 1
  coord-codex:
    needs: offline-mock
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - run: docker pull python@sha256:65a93d69fa75478d554f4ad27c85c1e69fa184956261b4301ebaf6dbb0a3543d
      - name: Simulate assigned Codex BLOCKED task in isolated mock job
        run: python -m orchestrator.hosted_coordination codex-blocked "$RUNNER_TEMP/coord" -
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordination-codex-blocked
          path: ${{ runner.temp }}/coord/coordination-ledger.json
          if-no-files-found: error
          retention-days: 1
  coord-kilo:
    needs: coord-codex
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: coordination-codex-blocked
          path: ${{ runner.temp }}/incoming
      - run: docker pull python@sha256:65a93d69fa75478d554f4ad27c85c1e69fa184956261b4301ebaf6dbb0a3543d
      - name: Route diagnostic-only mock Kilo task
        run: python -m orchestrator.hosted_coordination kilo-diagnostic "$RUNNER_TEMP/coord" "$RUNNER_TEMP/incoming/coordination-ledger.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordination-kilo-finding
          path: ${{ runner.temp }}/coord/coordination-ledger.json
          if-no-files-found: error
          retention-days: 1
  coord-codex-resume:
    needs: coord-kilo
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: coordination-kilo-finding
          path: ${{ runner.temp }}/incoming
      - name: Exact-head coordination acceptance tests
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_hosted_coordination.py
      - run: docker pull python@sha256:65a93d69fa75478d554f4ad27c85c1e69fa184956261b4301ebaf6dbb0a3543d
      - name: Return bounded finding to mock Codex and verify
        run: python -m orchestrator.hosted_coordination codex-resume "$RUNNER_TEMP/coord" "$RUNNER_TEMP/incoming/coordination-ledger.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coordination-mock-verified
          path: ${{ runner.temp }}/coord/coordination-ledger.json
          if-no-files-found: error
          retention-days: 1
