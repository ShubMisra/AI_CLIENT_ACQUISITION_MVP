name: Python checks

on:
  push:
    branches: [feat/codex-p1-integration]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile
        run: python -m compileall -q acqsys tests scripts
      - name: Whitespace check
        run: git diff --check
      - name: Tests (fixtures and mocked transports only)
        run: python -m pytest -q
      - name: Public extractor to central lead demo (fixture only)
        run: python -m scripts.demo_p1_fixture
